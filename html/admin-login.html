  <main class="auth admin-auth">
    <section class="auth__panel admin-auth__panel" aria-labelledby="admin-login-title">
      <h1 class="auth__title" id="admin-login-title">Вход в панель</h1>
      <form class="auth__form" action="admin-leads.html" method="post">
        <label class="field"><span class="field__label">Электронная почта</span><input class="field__control" type="email" name="email" required autocomplete="username" inputmode="email"></label>
        <label class="field"><span class="field__label">Пароль</span><input class="field__control" type="password" name="password" required data-error-required="Введите пароль" autocomplete="current-password"></label>
        <button class="button button--primary auth__submit" type="submit">Войти</button>
      </form>
      <a class="auth__link admin-auth__forgot" href="#admin-reset" data-sheet-open="admin-reset" aria-haspopup="dialog">Забыли пароль?</a>
    </section>
  </main>
  <dialog class="sheet sheet--window sheet--compact" id="admin-reset" aria-labelledby="admin-reset-title">
    <div class="modal">
      <div class="modal__head">
        <h2 class="modal__title sheet__title" id="admin-reset-title" tabindex="-1">Восстановление пароля</h2>
        <a class="icon-button" href="#" data-sheet-close aria-label="Закрыть окно"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></a>
      </div>
      <form class="auth__form" action="admin-login.html" method="post">
        <label class="field"><span class="field__label">Электронная почта</span><input class="field__control" type="email" name="email" required autocomplete="username" inputmode="email"></label>
        <button class="button button--primary auth__submit" type="submit">Отправить ссылку</button>
      </form>
    </div>
  </dialog>
